version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: exoplanet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exoplanet_classifier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - exoplanet_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d exoplanet_classifier" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exoplanet_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/exoplanet_classifier"
      PORT: 8000
    networks:
      - exoplanet_network
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mlflow_db:
    image: postgres:16-alpine
    container_name: mlflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow_password
      POSTGRES_DB: mlflow_db
    ports:
      - "5433:5432"
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    networks:
      - exoplanet_network

  mlflow_server:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: mlflow_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql+psycopg2://mlflow:mlflow_password@mlflow_db:5432/mlflow_db
      - MLFLOW_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_artifact_data:/mlflow/artifacts
    networks:
      - exoplanet_network
    depends_on:
      - mlflow_db
    command: >
      bash -c "pip install psycopg2-binary && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql+psycopg2://mlflow:mlflow_password@mlflow_db:5432/mlflow_db --default-artifact-root /mlflow/artifacts --serve-artifacts"

networks:
  exoplanet_network:
    driver: bridge

volumes:
  postgres_data:
  mlflow_db_data:
  mlflow_artifact_data:
